<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Advanced Inventory Pro</title>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
<div class="max-w-6xl mx-auto">

    <h1 class="text-4xl font-bold text-green-400 mb-8 border-b border-gray-700 pb-4">
         Inventory System
    </h1>

    <!-- ADD PRODUCT -->
    <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl mb-8 border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-gray-300">Add New Product</h2>

        <div class="grid grid-cols-1 md:grid-cols-6 gap-4">

            <input id="itemName" type="text" placeholder="Item Name"
                   class="bg-gray-700 p-3 rounded-xl border border-gray-600">

            <input id="itemQty" type="number" placeholder="Quantity"
                   class="bg-gray-700 p-3 rounded-xl border border-gray-600">

            <!-- CUSTOM UNIT -->
            <input id="itemUnit" type="text" placeholder="Unit (KG, Box, Meter...)"
                   class="bg-gray-700 p-3 rounded-xl border border-gray-600">

            <select id="itemCat"
                    class="bg-gray-700 p-3 rounded-xl border border-gray-600 text-gray-300"></select>

            <button onclick="addCategory()"
                    class="bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl">
                + Category
            </button>

            <button onclick="saveItem()"
                    class="bg-green-500 hover:bg-green-600 font-bold py-3 rounded-xl">
                Add Item
            </button>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-wrap gap-4 mb-8">
        <button onclick="loadItems()"
                class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg">
            Show All
        </button>

        <button onclick="showHistory()"
                class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg">
            Transaction History
        </button>

        <button onclick="recoverItem()"
                class="bg-yellow-600 hover:bg-yellow-700 px-6 py-2 rounded-lg">
            Recover by ID
        </button>
    </div>

    <!-- TABLE -->
    <div class="bg-gray-800 rounded-2xl overflow-hidden shadow-xl border border-gray-700">
        <table class="w-full text-left">
            <thead class="bg-gray-700 text-gray-300">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Name</th>
                <th class="p-4">Stock</th>
                <th class="p-4">Category</th>
                <th class="p-4 text-right">Actions</th>
            </tr>
            </thead>
            <tbody id="inventoryTable"></tbody>
        </table>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
